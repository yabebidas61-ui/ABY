<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ramo de rosas amarillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#0b211d;
    --bg-bottom:#04100e;
    --glow:rgba(255,196,60,0.24);
    --ink:#f3ecd8;
    color-scheme: dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg-top:#0e2a24; --bg-bottom:#05130f; --glow:rgba(255,196,60,0.22);
    }
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--bg-bottom);
    overflow:hidden;
    overscroll-behavior:none;
    font-family:'Jost', system-ui, sans-serif;
  }
  #scene{
    position:fixed; inset:0;
    width:100vw; height:100vh;
    display:block;
    touch-action:none;
  }
  .veil{
    position:fixed; left:0; right:0;
    display:flex; justify-content:center;
    pointer-events:none;
    color:var(--ink);
    text-align:center;
    letter-spacing:.02em;
  }
  #title{
    top:calc(env(safe-area-inset-top,0px) + 22px);
    flex-direction:column; gap:2px;
  }
  #title h1{
    margin:0;
    font-family:'Cormorant Garamond', Georgia, serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(22px, 6vw, 32px);
    color:#fff6da;
    text-shadow:0 2px 18px rgba(0,0,0,.55);
  }
  #title span{
    font-size:11px;
    font-weight:300;
    color:rgba(243,236,216,.62);
    text-shadow:0 1px 8px rgba(0,0,0,.6);
  }
  #hint{
    bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
    font-size:12px;
    font-weight:300;
    color:rgba(243,236,216,.55);
    transition:opacity .6s ease;
  }
  #hint.off{ opacity:0; }
  @media (min-width:720px){
    #title h1{ font-size:34px; }
  }
</style>
</head>
<body>
  <canvas id="scene" aria-label="Ramo de rosas amarillas fotorrealista, ilustración animada"></canvas>
  <div class="veil" id="title">
    <h1>Para Aby, mi osita</h1>
    <span>te amo · toca una rosa</span>
  </div>
  <div class="veil" id="hint">desliza el dedo para girar el ramo</div>
  <script>
(function () {
'use strict';

/* =====================================================================
   Utilidades
   ===================================================================== */
const TAU = Math.PI * 2;
const VW = 800, VH = 1200;               // espacio virtual del ramo
const TIE = { x: 400, y: 800 };          // punto donde se atan los tallos
const SEED = 20240921;
const LIGHT = -2.3;                      // luz desde arriba a la izquierda

let rnd;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function reseed(s) { rnd = mulberry32(s); }
reseed(SEED);
const rr = (a, b) => a + rnd() * (b - a);
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const h2r = (h) => { h = h.replace('#', ''); return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)]; };
const r2h = (r, g, b) => '#' + [r, g, b].map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
function mixHex(a, b, t) { const A = h2r(a), B = h2r(b); return r2h(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
function rgba(h, a) { const c = h2r(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

function mk(w, h, S) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * S));
  c.height = Math.max(1, Math.ceil(h * S));
  const x = c.getContext('2d');
  x.scale(S, S);
  return { c: c, x: x, w: w, h: h, S: S, ax: 0, ay: 0 };
}
function shadow(x, S, color, blur, ox, oy) {
  x.shadowColor = color; x.shadowBlur = blur * S;
  x.shadowOffsetX = (ox || 0) * S; x.shadowOffsetY = (oy || 0) * S;
}
function noShadow(x) { x.shadowColor = 'rgba(0,0,0,0)'; x.shadowBlur = 0; x.shadowOffsetX = 0; x.shadowOffsetY = 0; }
function qpt(p0, c, p1, t) {
  const u = 1 - t;
  return [u * u * p0[0] + 2 * u * t * c[0] + t * t * p1[0], u * u * p0[1] + 2 * u * t * c[1] + t * t * p1[1]];
}
function blobPath(x, pts) {
  const n = pts.length;
  x.beginPath();
  x.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    x.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  x.closePath();
}

/* =====================================================================
   Paletas de rosas amarillas
   ===================================================================== */
const PAL = [
  { deep: '#8c4f00', base: '#c98200', mid: '#f3c216', edge: '#ffe680', pale: '#fff4bd', blush: '#ff9a2e', bl: 0.10 }, // dorada clásica
  { deep: '#86680a', base: '#c7a10a', mid: '#f7d423', edge: '#fff194', pale: '#fffac8', blush: '#ffcf40', bl: 0.05 }, // limón
  { deep: '#87400a', base: '#c9700a', mid: '#f1a916', edge: '#ffd870', pale: '#ffeba8', blush: '#ff6a2a', bl: 0.18 }  // ámbar con rubor
];

/* =====================================================================
   PÉTALO / ROSA
   ===================================================================== */
function petalShape(x, L, w, wob) {
  x.beginPath();
  x.moveTo(0, 0);
  x.bezierCurveTo(L * 0.08, -w * 0.42, L * 0.42, -w * 0.66, L * 0.86, -w * 0.50);
  x.bezierCurveTo(L * 1.02, -w * 0.42, L * (1.04 + wob), -w * 0.14, L * 0.99, -w * 0.03);
  x.quadraticCurveTo(L * 0.962, 0, L * 0.99, w * 0.03);
  x.bezierCurveTo(L * (1.04 - wob), w * 0.14, L * 1.02, w * 0.42, L * 0.86, w * 0.50);
  x.bezierCurveTo(L * 0.42, w * 0.66, L * 0.08, w * 0.42, 0, 0);
  x.closePath();
}

function drawPetal(x, S, o) {
  const L = o.L, w = o.w, pal = o.pal, t = o.t;
  x.save();
  x.rotate(o.ang); x.translate(o.dist, 0);
  const base = mixHex(pal.base, pal.deep, t * 0.75);
  const mid = mixHex(pal.mid, pal.base, t * 0.5);
  const edge = mixHex(pal.edge, pal.mid, t * 0.65);

  shadow(x, S, 'rgba(70,34,0,0.55)', L * 0.10, 1.6, 2.6);
  let g = x.createLinearGradient(0, 0, L, 0);
  g.addColorStop(0, base); g.addColorStop(0.30, mid); g.addColorStop(0.72, mid); g.addColorStop(1, edge);
  x.fillStyle = g;
  petalShape(x, L, w, o.wob); x.fill();
  noShadow(x);

  x.save();
  petalShape(x, L, w, o.wob); x.clip();

  // Copa: centro más profundo, bordes más claros
  g = x.createRadialGradient(L * 0.55, 0, w * 0.02, L * 0.55, 0, w * 0.62);
  g.addColorStop(0, 'rgba(150,85,0,0.20)');
  g.addColorStop(0.6, 'rgba(150,85,0,0.02)');
  g.addColorStop(1, 'rgba(255,246,180,0.30)');
  x.fillStyle = g; x.fillRect(-2, -w, L * 1.2, w * 2);

  // Luz direccional según hacia dónde mira el pétalo
  const ld = Math.cos(o.ang - (o.light === undefined ? LIGHT : o.light));
  g = x.createLinearGradient(0, 0, L, 0);
  if (ld > 0) { g.addColorStop(0, 'rgba(255,240,160,0)'); g.addColorStop(1, 'rgba(255,245,175,' + (0.32 * ld) + ')'); }
  else { g.addColorStop(0, 'rgba(70,35,0,0)'); g.addColorStop(1, 'rgba(70,35,0,' + (0.30 * -ld) + ')'); }
  x.fillStyle = g; x.fillRect(-2, -w, L * 1.2, w * 2);

  // Venas finas
  x.lineWidth = 0.7;
  for (let i = -7; i <= 7; i++) {
    const a = i * 0.055;
    x.strokeStyle = (i & 1) ? 'rgba(120,70,0,0.08)' : 'rgba(255,245,180,0.09)';
    x.beginPath();
    x.moveTo(L * 0.02, 0);
    x.quadraticCurveTo(L * 0.5, Math.tan(a) * L * 0.52, L * 0.98, Math.tan(a) * L);
    x.stroke();
  }

  // Rubor en el borde
  g = x.createLinearGradient(L * 0.62, 0, L, 0);
  g.addColorStop(0, rgba(pal.blush, 0));
  g.addColorStop(1, rgba(pal.blush, pal.bl * (1 - t * 0.7)));
  x.fillStyle = g; x.fillRect(L * 0.6, -w, L * 0.5, w * 2);

  // Labio enrollado (brillo) en el borde superior
  x.lineCap = 'round';
  x.strokeStyle = rgba(pal.pale, 0.55);
  x.lineWidth = Math.max(1.2, L * 0.024);
  x.beginPath();
  x.moveTo(L * 0.80, -w * 0.49);
  x.bezierCurveTo(L * 1.02, -w * 0.42, L * (1.04 + o.wob), -w * 0.14, L * 0.99, -w * 0.03);
  x.quadraticCurveTo(L * 0.962, 0, L * 0.99, w * 0.03);
  x.bezierCurveTo(L * (1.04 - o.wob), w * 0.14, L * 1.02, w * 0.42, L * 0.80, w * 0.49);
  x.stroke();
  // sombra interior del labio
  x.strokeStyle = 'rgba(140,80,0,0.16)';
  x.lineWidth = L * 0.035;
  x.beginPath();
  x.moveTo(L * 0.76, -w * 0.47);
  x.bezierCurveTo(L * 0.96, -w * 0.40, L * 0.98, -w * 0.14, L * 0.94, -w * 0.02);
  x.quadraticCurveTo(L * 0.92, 0, L * 0.94, w * 0.02);
  x.bezierCurveTo(L * 0.98, w * 0.14, L * 0.96, w * 0.40, L * 0.76, w * 0.47);
  x.stroke();
  x.restore();
  x.restore();
}

const RINGS = [
  { n: 5, reach: 1.00, dist: 0.10 },
  { n: 5, reach: 0.85, dist: 0.08 },
  { n: 5, reach: 0.70, dist: 0.06 },
  { n: 4, reach: 0.56, dist: 0.05 },
  { n: 4, reach: 0.44, dist: 0.04 },
  { n: 3, reach: 0.33, dist: 0.03 },
  { n: 3, reach: 0.23, dist: 0.02 }
];

function centerSpiral(x, S, R, pal) {
  x.save();
  let g = x.createRadialGradient(0, 0, 0, 0, 0, R);
  g.addColorStop(0, '#5a3000'); g.addColorStop(1, pal.deep);
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, R * 0.8, 0, TAU); x.fill();
  x.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const a = i * 2.05 + rr(0, 0.5), rad = R * (0.66 - i * 0.13);
    const ox = Math.cos(a) * R * 0.10, oy = Math.sin(a) * R * 0.10;
    shadow(x, S, 'rgba(60,28,0,0.55)', R * 0.15, 0.8, 1.2);
    x.lineWidth = R * 0.24; x.strokeStyle = mixHex(pal.base, pal.mid, i / 3);
    x.beginPath(); x.arc(ox, oy, rad, a - 1.5, a + 1.5); x.stroke();
    noShadow(x);
    x.lineWidth = R * 0.055; x.strokeStyle = rgba(pal.pale, 0.55);
    x.beginPath(); x.arc(ox, oy, rad + R * 0.06, a - 1.15, a + 0.25); x.stroke();
  }
  x.restore();
}

function drawFace(x, S, r, o, pal) {
  const start = o.open < 0.75 ? 1 : 0;
  const norm = 1 / RINGS[start].reach;
  const nR = RINGS.length - start;
  let g = x.createRadialGradient(0, 0, 0, 0, 0, r * 0.7);
  g.addColorStop(0, pal.deep); g.addColorStop(1, rgba(pal.base, 0));
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, r * 0.7, 0, TAU); x.fill();
  for (let i = start; i < RINGS.length; i++) {
    const rg = RINGS[i], t = (i - start) / (nR - 1);
    const reach = r * rg.reach * norm;
    const off = rnd() * TAU;
    for (let k = 0; k < rg.n; k++) {
      const L = reach * rr(0.93, 1.07);
      const w = Math.min(L * 1.75, 1.32 * TAU * 0.62 * L / rg.n) * rr(0.92, 1.08);
      drawPetal(x, S, {
        ang: off + k * TAU / rg.n + rr(-0.14, 0.14),
        dist: rg.dist * r * norm * rr(0.6, 1.4),
        L: L, w: w, t: t, pal: pal, wob: rr(-0.03, 0.05)
      });
    }
    const ao = x.createRadialGradient(0, 0, 0, 0, 0, reach * 0.78);
    ao.addColorStop(0, 'rgba(80,38,0,0.17)');
    ao.addColorStop(0.6, 'rgba(80,38,0,0.06)');
    ao.addColorStop(1, 'rgba(80,38,0,0)');
    x.fillStyle = ao; x.beginPath(); x.arc(0, 0, reach * 0.78, 0, TAU); x.fill();
  }
  centerSpiral(x, S, r * RINGS[RINGS.length - 1].reach * norm, pal);
}

function drawCup(x, S, r, pal, cx, cy) {
  x.save();
  x.translate(cx, cy + r * 0.24);
  shadow(x, S, 'rgba(30,15,0,0.55)', r * 0.14, 2, 5);
  x.beginPath();
  x.moveTo(-r, -r * 0.05);
  x.bezierCurveTo(-r * 1.05, r * 0.55, -r * 0.6, r * 1.0, 0, r * 1.0);
  x.bezierCurveTo(r * 0.6, r * 1.0, r * 1.05, r * 0.55, r, -r * 0.05);
  x.closePath();
  x.fillStyle = mixHex(pal.mid, pal.base, 0.5); x.fill();
  noShadow(x);
  x.clip();
  const order = [0, 4, 1, 3, 2];
  for (let i = 0; i < 5; i++) {
    const u = (order[i] - 2) / 2;
    const lx = u * r * 0.62, ly = r * 0.30, rx = r * 0.50, ry = r * 0.78;
    x.save();
    x.translate(lx, ly); x.rotate(u * 0.55);
    shadow(x, S, 'rgba(50,25,0,0.45)', r * 0.07, 1.5, 2.5);
    const g = x.createLinearGradient(0, -ry, 0, ry);
    g.addColorStop(0, mixHex(pal.edge, pal.mid, 0.3));
    g.addColorStop(0.5, pal.mid);
    g.addColorStop(1, mixHex(pal.base, pal.deep, 0.45));
    x.fillStyle = g;
    x.beginPath(); x.ellipse(0, 0, rx, ry, 0, 0, TAU); x.fill();
    noShadow(x);
    x.strokeStyle = rgba(pal.pale, 0.38); x.lineWidth = r * 0.02;
    x.beginPath(); x.ellipse(0, 0, rx * 0.97, ry * 0.97, 0, Math.PI * 1.05, Math.PI * 1.75); x.stroke();
    x.restore();
  }
  x.restore();
}

function sepal(x, S, len, wid, ang) {
  x.save();
  x.rotate(ang);
  shadow(x, S, 'rgba(10,30,5,0.5)', 3, 1, 2);
  x.beginPath();
  x.moveTo(0, -wid * 0.25);
  x.bezierCurveTo(len * 0.25, -wid * 0.75, len * 0.65, -wid * 0.55, len, 0);
  x.bezierCurveTo(len * 0.65, wid * 0.55, len * 0.25, wid * 0.75, 0, wid * 0.25);
  x.closePath();
  const g = x.createLinearGradient(0, -wid, 0, wid);
  g.addColorStop(0, '#6a9330'); g.addColorStop(0.5, '#3d6b1d'); g.addColorStop(1, '#234811');
  x.fillStyle = g; x.fill();
  noShadow(x);
  x.strokeStyle = 'rgba(175,215,115,0.5)'; x.lineWidth = 0.9;
  x.beginPath(); x.moveTo(len * 0.05, 0); x.lineTo(len * 0.92, 0); x.stroke();
  x.restore();
}
function drawSepals(x, S, r, ax, ay) {
  const list = [[-112, 0.34], [108, 0.36], [-72, 0.52], [64, 0.50], [-40, 0.60], [28, 0.58], [-6, 0.46]];
  for (let i = 0; i < list.length; i++) {
    x.save();
    x.translate(ax, ay);
    sepal(x, S, r * list[i][1], r * 0.10, -Math.PI / 2 + list[i][0] * Math.PI / 180);
    x.restore();
  }
  // receptáculo
  x.save();
  x.translate(ax, ay);
  const g = x.createRadialGradient(-2, -2, 1, 0, 0, r * 0.15);
  g.addColorStop(0, '#79a238'); g.addColorStop(1, '#2f5a17');
  x.fillStyle = g; x.beginPath(); x.ellipse(0, r * 0.02, r * 0.13, r * 0.11, 0, 0, TAU); x.fill();
  x.restore();
}

function drop(x, S, px, py, rad) {
  x.save(); x.translate(px, py);
  x.fillStyle = 'rgba(50,25,0,0.30)';
  x.beginPath(); x.ellipse(rad * 0.35, rad * 0.5, rad * 1.05, rad * 0.85, 0, 0, TAU); x.fill();
  const g = x.createRadialGradient(-rad * 0.25, -rad * 0.3, rad * 0.05, 0, 0, rad);
  g.addColorStop(0, 'rgba(255,255,255,0.10)');
  g.addColorStop(0.65, 'rgba(255,255,235,0.16)');
  g.addColorStop(1, 'rgba(255,255,255,0.62)');
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, rad, 0, TAU); x.fill();
  x.strokeStyle = 'rgba(255,255,255,0.55)'; x.lineWidth = Math.max(0.4, rad * 0.12);
  x.beginPath(); x.arc(0, 0, rad * 0.86, 0.15 * Math.PI, 0.75 * Math.PI); x.stroke();
  x.fillStyle = 'rgba(255,255,255,0.95)';
  x.beginPath(); x.ellipse(-rad * 0.32, -rad * 0.38, rad * 0.30, rad * 0.20, -0.6, 0, TAU); x.fill();
  x.restore();
}

function makeRose(r, o, S) {
  const pal = PAL[o.pal % PAL.length];
  const W = r * 2.5, H = r * 2.85, cx = W / 2, cy = r * 1.2;
  const sp = mk(W, H, S), x = sp.x;
  sp.ax = cx; sp.ay = cy;
  drawCup(x, S, r * 0.94, pal, cx, cy);
  x.save(); x.translate(cx, cy); x.scale(1, o.ky);
  drawFace(x, S, r, o, pal);
  x.restore();
  drawSepals(x, S, r, cx, cy + r * 1.2);
  // Iluminación global
  x.save();
  x.globalCompositeOperation = 'source-atop';
  let g = x.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.05, cx - r * 0.2, cy - r * 0.25, r * 1.1);
  g.addColorStop(0, 'rgba(255,250,200,0.20)'); g.addColorStop(1, 'rgba(255,250,200,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  g = x.createRadialGradient(cx - r * 0.2, cy - r * 0.2, r * 0.7, cx - r * 0.2, cy - r * 0.2, r * 1.7);
  g.addColorStop(0, 'rgba(60,30,0,0)'); g.addColorStop(1, 'rgba(60,30,0,0.24)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.restore();
  // Gotas de rocío
  const nd = 4 + Math.floor(rnd() * 3);
  for (let i = 0; i < nd; i++) {
    const a = rnd() * TAU, d = r * rr(0.30, 0.86);
    drop(x, S, cx + Math.cos(a) * d, cy + Math.sin(a) * d * o.ky, r * rr(0.024, 0.048));
  }
  return sp;
}

function makeBud(r, S, palIdx) {
  const pal = PAL[palIdx % PAL.length];
  const W = r * 2.4, H = r * 3.5;
  const sp = mk(W, H, S), x = sp.x;
  sp.ax = W / 2; sp.ay = H - r * 0.3;
  x.translate(sp.ax, sp.ay);
  const R = (v) => v * r;
  function body() {
    x.beginPath();
    x.moveTo(0, 0);
    x.bezierCurveTo(R(-0.78), R(-0.25), R(-0.98), R(-1.15), R(-0.52), R(-1.95));
    x.bezierCurveTo(R(-0.36), R(-2.25), R(-0.12), R(-2.45), R(0.02), R(-2.62));
    x.bezierCurveTo(R(0.20), R(-2.40), R(0.62), R(-2.05), R(0.85), R(-1.35));
    x.bezierCurveTo(R(1.0), R(-0.8), R(0.78), R(-0.25), 0, 0);
    x.closePath();
  }
  shadow(x, S, 'rgba(20,10,0,0.55)', r * 0.15, 2, 4);
  let g = x.createLinearGradient(R(-1), 0, R(1), 0);
  g.addColorStop(0, mixHex(pal.base, pal.deep, 0.3)); g.addColorStop(0.35, pal.mid); g.addColorStop(0.65, mixHex(pal.edge, pal.mid, 0.4)); g.addColorStop(1, mixHex(pal.base, pal.deep, 0.5));
  x.fillStyle = g; body(); x.fill(); noShadow(x);
  x.save(); body(); x.clip();
  // pétalo frontal envolvente
  shadow(x, S, 'rgba(70,34,0,0.5)', r * 0.10, -2, 2);
  g = x.createLinearGradient(R(-0.7), R(-0.5), R(0.5), R(-2));
  g.addColorStop(0, pal.mid); g.addColorStop(0.5, mixHex(pal.edge, pal.mid, 0.5)); g.addColorStop(1, pal.pale);
  x.fillStyle = g;
  x.beginPath();
  x.moveTo(R(-0.78), R(-0.55));
  x.bezierCurveTo(R(-0.72), R(-1.5), R(-0.28), R(-2.15), R(0.02), R(-2.62));
  x.bezierCurveTo(R(0.32), R(-2.0), R(0.58), R(-1.3), R(0.52), R(-0.5));
  x.bezierCurveTo(R(0.2), R(-0.25), R(-0.4), R(-0.25), R(-0.78), R(-0.55));
  x.closePath(); x.fill(); noShadow(x);
  // costuras
  x.lineCap = 'round';
  x.strokeStyle = 'rgba(110,60,0,0.35)'; x.lineWidth = r * 0.03;
  x.beginPath(); x.moveTo(R(0.86), R(-0.65)); x.bezierCurveTo(R(0.55), R(-1.3), R(0.25), R(-1.9), R(0.05), R(-2.6)); x.stroke();
  x.strokeStyle = rgba(pal.pale, 0.5); x.lineWidth = r * 0.02;
  x.beginPath(); x.moveTo(R(-0.60), R(-0.7)); x.bezierCurveTo(R(-0.55), R(-1.45), R(-0.22), R(-2.05), R(0.0), R(-2.55)); x.stroke();
  // venas
  x.strokeStyle = 'rgba(120,70,0,0.10)'; x.lineWidth = 0.7;
  for (let i = 0; i < 7; i++) {
    x.beginPath(); x.moveTo(R(-0.3 + i * 0.08), R(-0.3));
    x.quadraticCurveTo(R(-0.4 + i * 0.12), R(-1.4), R(-0.05 + i * 0.03), R(-2.4)); x.stroke();

  x.fillStyle = g; x.fillRect(R(-1.2), R(-1.4), R(2.4), R(1.5));
  x.restore();
  // sépalos
  const list = [[-72, 1.05], [64, 1.0], [-38, 1.45], [34, 1.35], [-6, 1.6]];
  for (let i = 0; i < list.length; i++) {

  }
  drop(x, S, R(-0.15), R(-1.7), r * 0.05);

}

/* =====================================================================
   HOJAS, RELLENOS
   ===================================================================== */
function makeLeaf(len, wid, S, v) {
  const pad = 12, W = wid + pad * 2, H = len + pad * 2;
  const sp = mk(W, H, S), x = sp.x;
  sp.ax = W / 2; sp.ay = H - pad;
  x.translate(sp.ax, sp.ay); x.rotate(-Math.PI / 2);      // +x apunta hacia arriba
  const bend = v.bend * len;
  const yc = (t) => bend * t * t;
  const hw = (t) => wid * 0.5 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.78)), 0.85);
  const N = 48, teeth = 26, top = [], bot = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N, e = (t > 0.05 && t < 0.97) ? 1 : 0;
    const k1 = 1 + 0.085 * ((t * teeth) % 1 - 0.5) * 2 * e;
    const k2 = 1 + 0.085 * (((t * teeth + 0.5) % 1) - 0.5) * 2 * e;
    top.push([t * len, yc(t) - hw(t) * k1]);
    bot.push([t * len, yc(t) + hw(t) * k2]);
  }
  function outline() {
    x.beginPath(); x.moveTo(top[0][0], top[0][1]);
    for (let i = 1; i <= N; i++) x.lineTo(top[i][0], top[i][1]);
    for (let i = N; i >= 0; i--) x.lineTo(bot[i][0], bot[i][1]);
    x.closePath();
  }
  shadow(x, S, 'rgba(0,0,0,0.5)', 6, 2, 4);
  let g = x.createLinearGradient(0, -wid * 0.5, 0, wid * 0.5);
  g.addColorStop(0, v.c[2]); g.addColorStop(0.5, v.c[1]); g.addColorStop(1, v.c[0]);
  x.fillStyle = g; outline(); x.fill(); noShadow(x);
  x.save(); outline(); x.clip();
  // brillo satinado
  g = x.createLinearGradient(0, 0, len, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.45, 'rgba(230,255,200,0.16)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, -wid, len, wid * 2);
  // rebaje del centro
  g = x.createLinearGradient(0, -wid * 0.5, 0, wid * 0.5);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, 'rgba(0,30,0,0.18)'); g.addColorStop(1, 'rgba(0,0,0,0.12)');
  x.fillStyle = g; x.fillRect(0, -wid, len, wid * 2);
  // venas secundarias
  x.lineCap = 'round';
  for (let j = 1; j <= 9; j++) {
    const t0 = 0.07 + 0.09 * j, t1 = Math.min(0.97, t0 + 0.14);
    for (let s = -1; s <= 1; s += 2) {
      x.strokeStyle = 'rgba(200,235,140,0.34)'; x.lineWidth = 0.9 * (1 - j * 0.05);
      x.beginPath();
      x.moveTo(t0 * len, yc(t0));
      x.quadraticCurveTo((t0 + 0.06) * len, yc(t0 + 0.06) + s * hw(t0 + 0.06) * 0.35, t1 * len, yc(t1) + s * hw(t1) * 0.86);
      x.stroke();
    }
  }
  // nervio central
  x.beginPath();
  x.moveTo(0, -2.2);
  for (let i = 0; i <= 20; i++) { const t = i / 20; x.lineTo(t * len * 0.97, yc(t * 0.97) - (2.2 - 1.7 * t)); }
  for (let i = 20; i >= 0; i--) { const t = i / 20; x.lineTo(t * len * 0.97, yc(t * 0.97) + (2.2 - 1.7 * t)); }
  x.closePath();
  x.fillStyle = 'rgba(205,235,150,0.78)'; x.fill();
  x.restore();
  x.strokeStyle = 'rgba(8,38,10,0.55)'; x.lineWidth = 0.9; outline(); x.stroke();
  // rocío
  const dn = 1 + Math.floor(rnd() * 2);
  for (let i = 0; i < dn; i++) {
    const t = rr(0.25, 0.7), ys = rr(-0.5, 0.5) * hw(t);
    x.save(); x.rotate(0);
    drop(x, S, t * len, yc(t) + ys, rr(2.4, 3.6));
    x.restore();
  }
  return sp;
}

function makeGyp(S, size) {
  const W = size * 1.8, H = size * 1.4;
  const sp = mk(W, H, S), x = sp.x;
  sp.ax = W / 2; sp.ay = H - 6;
  function flower(px, py, rad) {
    x.save(); x.translate(px, py); x.rotate(rnd() * TAU);
    shadow(x, S, 'rgba(15,30,10,0.35)', 2.5, 0.8, 1.2);
    x.fillStyle = pick(['#ffffff', '#fbf7ff', '#fffdf3', '#f6fbff']);
    for (let i = 0; i < 5; i++) {
      x.save(); x.rotate(i * TAU / 5);
      x.beginPath(); x.ellipse(rad * 0.55, 0, rad * 0.56, rad * 0.4, 0, 0, TAU); x.fill();
      x.restore();
    }
    noShadow(x);
    x.strokeStyle = 'rgba(140,150,165,0.35)'; x.lineWidth = 0.35;
    for (let i = 0; i < 5; i++) { const a = i * TAU / 5; x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(a) * rad * 0.95, Math.sin(a) * rad * 0.95); x.stroke(); }
    x.fillStyle = '#dbe28c'; x.beginPath(); x.arc(0, 0, rad * 0.24, 0, TAU); x.fill();
    x.fillStyle = 'rgba(115,125,40,0.65)'; x.beginPath(); x.arc(0, 0, rad * 0.1, 0, TAU); x.fill();
    x.restore();
  }
  function twig(px, py, ang, len, d) {
    const nx = px + Math.sin(ang) * len, ny = py - Math.cos(ang) * len;
    const mx = (px + nx) / 2 + rr(-len * 0.12, len * 0.12), my = (py + ny) / 2 + rr(-len * 0.08, len * 0.08);
    x.strokeStyle = d >= 2 ? '#5b7b45' : '#7d9b5b'; x.lineWidth = 0.5 + d * 0.5; x.lineCap = 'round';
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(mx, my, nx, ny); x.stroke();
    if (d > 0) {
      const k = d > 1 ? 3 : 2 + Math.floor(rnd() * 2);
      for (let j = 0; j < k; j++) twig(nx, ny, ang + (j - (k - 1) / 2) * rr(0.5, 0.85) + rr(-0.15, 0.15), len * rr(0.62, 0.78), d - 1);
    } else {
      flower(nx, ny, rr(3.4, 5.4));
    }
    if (d === 1 && rnd() < 0.7) flower(mx, my, rr(2.8, 4.2));
  }
  twig(sp.ax, sp.ay, 0, size * 0.38, 3);
  return sp;
}

function makeEuc(S, len) {
  const W = len * 0.8, H = len * 1.1;
  const sp = mk(W, H, S), x = sp.x;
  const A = [W * 0.4, H - 6], Cc = [W * 0.4 + len * 0.22, H - len * 0.5], B = [W * 0.4 + len * 0.05, H - len * 1.0];
  sp.ax = A[0]; sp.ay = A[1];
  x.strokeStyle = '#6a8272'; x.lineWidth = 2.6; x.lineCap = 'round';
  x.beginPath(); x.moveTo(A[0], A[1]); x.quadraticCurveTo(Cc[0], Cc[1], B[0], B[1]); x.stroke();
  x.strokeStyle = 'rgba(200,225,210,0.5)'; x.lineWidth = 0.9;
  x.beginPath(); x.moveTo(A[0] - 0.8, A[1]); x.quadraticCurveTo(Cc[0] - 0.8, Cc[1], B[0] - 0.8, B[1]); x.stroke();
  function leaf(px, py, ang, sz) {
    x.save(); x.translate(px, py); x.rotate(ang);
    shadow(x, S, 'rgba(0,0,0,0.4)', 5, 1.5, 2.5);
    const g = x.createRadialGradient(sz * 0.55, -sz * 0.25, sz * 0.05, sz, 0, sz * 1.1);
    g.addColorStop(0, '#c9dccf'); g.addColorStop(0.55, '#93b3a2'); g.addColorStop(1, '#5f8573');
    x.fillStyle = g; x.beginPath(); x.ellipse(sz, 0, sz, sz * 0.92, 0, 0, TAU); x.fill();
    noShadow(x);
    x.strokeStyle = 'rgba(235,248,240,0.45)'; x.lineWidth = 0.9;
    x.beginPath(); x.ellipse(sz, 0, sz * 0.97, sz * 0.89, 0, Math.PI * 1.1, Math.PI * 1.8); x.stroke();
    x.strokeStyle = 'rgba(70,105,90,0.45)'; x.lineWidth = 0.8;
    x.beginPath(); x.moveTo(sz * 0.05, 0); x.lineTo(sz * 1.85, 0); x.stroke();
    x.restore();
  }
  const n = 12;
  for (let i = 0; i < n; i++) {
    const t = 0.16 + i * (0.80 / (n - 1));
    const p = qpt(A, Cc, B, t), p2 = qpt(A, Cc, B, Math.min(1, t + 0.02));
    const tang = Math.atan2(p2[1] - p[1], p2[0] - p[0]);
    const side = (i & 1) ? 1 : -1;
    const sz = lerp(17, 9.5, t) * rr(0.9, 1.1);
    leaf(p[0], p[1], tang + side * rr(0.85, 1.25), sz);
  }
  const tp = qpt(A, Cc, B, 1), tp2 = qpt(A, Cc, B, 0.98);
  leaf(tp[0], tp[1], Math.atan2(tp[1] - tp2[1], tp[0] - tp2[0]), 9);
  return sp;
}

function makeLav(S, len) {
  const W = len * 0.6, H = len * 1.05;
  const sp = mk(W, H, S), x = sp.x;
  const A = [W * 0.5, H - 6], Cc = [W * 0.5 - len * 0.16, H - len * 0.55], B = [W * 0.5 - len * 0.04, H - len * 1.0];
  sp.ax = A[0]; sp.ay = A[1];
  x.strokeStyle = '#7d9a63'; x.lineWidth = 2.2; x.lineCap = 'round';
  x.beginPath(); x.moveTo(A[0], A[1]); x.quadraticCurveTo(Cc[0], Cc[1], B[0], B[1]); x.stroke();
  const cols = ['#7b5fc0', '#9277d6', '#6a4bb0', '#a48be3', '#8264c9'];
  const N = 16;
  for (let i = 0; i < N; i++) {
    const t = 0.52 + i * (0.48 / (N - 1));
    const p = qpt(A, Cc, B, t), p2 = qpt(A, Cc, B, Math.min(1, t + 0.02));
    const tang = Math.atan2(p2[1] - p[1], p2[0] - p[0]);
    const sz = lerp(1.0, 0.55, i / N);
    for (let s = -1; s <= 1; s += 2) {
      const a = tang + s * rr(0.45, 0.8);
      x.save(); x.translate(p[0], p[1]); x.rotate(a);
      shadow(x, S, 'rgba(20,10,40,0.4)', 2, 0.6, 1);
      x.fillStyle = pick(cols);
      x.beginPath(); x.ellipse(4.2 * sz, 0, 5.2 * sz, 2.5 * sz, 0, 0, TAU); x.fill();
      noShadow(x);
      x.fillStyle = 'rgba(235,225,255,0.5)';
      x.beginPath(); x.ellipse(4.6 * sz, -0.8 * sz, 2.4 * sz, 0.8 * sz, 0, 0, TAU); x.fill();
      x.restore();
    }
  }
  return sp;
}

function makeCrasp(S, len) {
  const W = 60, H = len + 30;
  const sp = mk(W, H, S), x = sp.x;
  sp.ax = W / 2; sp.ay = H - 4;
  const rad = 15;
  const top = [W / 2 + 3, H - len - 4];
  x.strokeStyle = '#6f9a4a'; x.lineWidth = 2.2; x.lineCap = 'round';
  x.beginPath(); x.moveTo(sp.ax, sp.ay); x.quadraticCurveTo(W / 2 - 6, H - len * 0.5, top[0], top[1]); x.stroke();
  x.save(); x.translate(top[0], top[1] - rad * 0.6);
  shadow(x, S, 'rgba(0,0,0,0.45)', 5, 2, 3);
  let g = x.createRadialGradient(-rad * 0.35, -rad * 0.4, rad * 0.1, 0, 0, rad);
  g.addColorStop(0, '#ffe870'); g.addColorStop(0.6, '#f4b90c'); g.addColorStop(1, '#b97b00');
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, rad, 0, TAU); x.fill(); noShadow(x);
  x.save(); x.beginPath(); x.arc(0, 0, rad, 0, TAU); x.clip();
  for (let i = 0; i < 130; i++) {
    const a = rnd() * TAU, d = Math.sqrt(rnd()) * rad;
    const px = Math.cos(a) * d, py = Math.sin(a) * d;
    const lit = clamp(1 - Math.hypot(px + rad * 0.35, py + rad * 0.4) / (rad * 1.6), 0, 1);
    x.fillStyle = lit > 0.45 ? 'rgba(255,245,150,' + (0.5 + lit * 0.4) + ')' : 'rgba(150,90,0,0.45)';
    x.beginPath(); x.arc(px, py, rr(0.7, 1.4), 0, TAU); x.fill();
  }
  x.restore(); x.restore();
  return sp;
}

function tissue(x, S, pts, c1, c2, side, dens) {
  x.save();
  shadow(x, S, 'rgba(0,0,0,0.5)', 24, side * 6, 10);
  blobPath(x, pts);
  const g = x.createLinearGradient(pts[0][0], pts[0][1], pts[4][0], pts[4][1]);
  g.addColorStop(0, c2); g.addColorStop(1, c1);
  x.fillStyle = g; x.fill(); noShadow(x);
  x.clip();
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  pts.forEach(p => { minx = Math.min(minx, p[0]); maxx = Math.max(maxx, p[0]); miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); });
  const nk = pts[0];
  for (let i = 0; i < dens; i++) {
    const px = rr(minx, maxx), py = rr(miny, maxy);
    const dx = px - nk[0], dy = py - nk[1], dl = Math.hypot(dx, dy) || 1;
    const len = rr(30, 110), ux = dx / dl, uy = dy / dl;
    x.strokeStyle = rnd() < 0.5 ? 'rgba(255,255,255,' + rr(0.05, 0.13) + ')' : 'rgba(0,20,10,' + rr(0.08, 0.18) + ')';
    x.lineWidth = rr(0.6, 2);
    x.beginPath();
    x.moveTo(px - ux * len / 2, py - uy * len / 2);
    x.quadraticCurveTo(px + rr(-8, 8), py + rr(-8, 8), px + ux * len / 2, py + uy * len / 2);
    x.stroke();
  }
  x.restore();
  x.save();
  blobPath(x, pts); x.strokeStyle = 'rgba(255,255,255,0.16)'; x.lineWidth = 2; x.stroke();
  x.restore();
}

function getNoise(x) {
  const c = document.createElement('canvas'); c.width = 96; c.height = 96;
  const nx = c.getContext('2d');
  const id = nx.createImageData(96, 96);
  for (let i = 0; i < id.data.length; i += 4) {

    id.data[i] = v; id.data[i + 1] = v; id.data[i + 2] = v; id.data[i + 3] = 26 + Math.floor(rnd() * 26);

  nx.putImageData(id, 0, 0);
  return x.createPattern(c, 'repeat');
}

  x.beginPath(); x.moveTo(-14 * k, lineY); x.lineTo(14 * k, lineY); x.stroke();

function makeItem(spr, x, y, rot, s) {
  return { spr: spr, x: x, y: y, rot: rot, s: s || 1, ph: rr(0, TAU), amp: rr(0.7, 1.3) };
}

function build(S) {
  reseed(SEED);
  const B = { S: S };
  B.back = drawBackLayer(S);

  const leafV = [
    { c: ['#173f1a', '#2a7327', '#58a03c'], bend: 0.06 },
    { c: ['#1c4c1f', '#31792c', '#68ad44'], bend: -0.05 },
    { c: ['#20481c', '#3a862d', '#7ab749'], bend: 0.03 }
  ];
  const leaves = [makeLeaf(124, 60, S, leafV[0]), makeLeaf(108, 52, S, leafV[1]), makeLeaf(140, 66, S, leafV[2]), makeLeaf(96, 46, S, leafV[0])];
  const gyps = [makeGyp(S, 190), makeGyp(S, 170), makeGyp(S, 210)];
  const eucs = [makeEuc(S, 260), makeEuc(S, 220)];
  const lavs = [makeLav(S, 250), makeLav(S, 210)];
  const crasps = [makeCrasp(S, 240), makeCrasp(S, 205)];

  const C = { x: 400, y: 565 };
  const bnd = (a) => 1 / Math.sqrt(Math.pow(Math.sin(a) / 300, 2) + Math.pow(Math.cos(a) / 300, 2));
  const at = (a, R) => ({ x: C.x + Math.sin(a) * R, y: C.y - Math.cos(a) * R });
  const D = Math.PI / 180;

  B.backItems = []; B.frontItems = [];
  // Hojas de rosal alrededor del domo
  for (let deg = -100; deg <= 100; deg += 20) {
    const a = (deg + rr(-5, 5)) * D, R0 = bnd(a) * 0.68;
    const p = at(a, R0);
    B.backItems.push(makeItem(pick(leaves), p.x, p.y, a + rr(-0.22, 0.22), rr(1.0, 1.3)));
  }
  // Baby's breath
  [-84, -64, -42, -18, 8, 32, 56, 80].forEach((deg, i) => {
    const a = (deg + rr(-4, 4)) * D, p = at(a, bnd(a) * 0.62);
    B.backItems.push(makeItem(gyps[i % gyps.length], p.x, p.y, a + rr(-0.15, 0.15), rr(0.95, 1.2)));
  });
  // Eucalipto
  [-76, -34, 28, 70].forEach((deg, i) => {
    const a = deg * D, p = at(a, bnd(a) * 0.5);
    B.backItems.push(makeItem(eucs[i % 2], p.x, p.y, a + rr(-0.1, 0.1), rr(1.0, 1.15)));
  });
  // Lavanda
  [-58, -8, 50].forEach((deg, i) => {
    const a = deg * D, p = at(a, bnd(a) * 0.5);
    B.backItems.push(makeItem(lavs[i % 2], p.x, p.y, a + rr(-0.1, 0.1), 1.1));
  });
  // Craspedia (bolitas amarillas)
  [-26, 18, -66, 62].forEach((deg, i) => {
    const a = deg * D, p = at(a, bnd(a) * 0.5);
    B.backItems.push(makeItem(crasps[i % 2], p.x, p.y, a + rr(-0.08, 0.08), 1.1));
  });

  // Follaje que asoma en el escote (delante de las rosas)
  [[-1, 246, 690, -70], [1, 554, 690, 70], [-1, 330, 738, -54], [1, 470, 742, 54]].forEach((q, i) => {
    B.frontItems.push(makeItem(leaves[(i + 1) % 4], q[1], q[2], q[3] * D, 1.05));
  });
  [[212, 660, -66], [590, 656, 66], [296, 704, -30], [512, 708, 34]].forEach((q, i) => {
    B.frontItems.push(makeItem(gyps[i % 3], q[0], q[1], q[2] * D, 0.85));
  });

  // Rosas y capullos
  B.roses = [];
  const all = BUDS.map(b => Object.assign({ bud: true }, b)).concat(ROSES);
  all.forEach(d => {
    const spr = d.bud ? makeBud(d.r, S, d.pal) : makeRose(d.r, d, S);
    const rot = Math.atan2(d.x - TIE.x, TIE.y - d.y) * 0.92 + rr(-0.1, 0.1);
    const anchorOff = d.bud ? 0 : d.r * 1.2;
    let A, hx = d.x, hy = d.y;
    if (d.bud) {
      // en el capullo el sprite se ancla en la base
      const up = 0; // anchor == posición
      A = { x: d.x, y: d.y };
    } else {
      A = { x: d.x - Math.sin(rot) * anchorOff, y: d.y + Math.cos(rot) * anchorOff };
    }
    B.roses.push({ spr: spr, x: d.x, y: d.y, rot: rot, A: A, r: d.r, bud: !!d.bud, ph: rr(0, TAU), amp: rr(0.8, 1.2), kick: 0, kickV: 0, tx: TIE.x + (d.x - TIE.x) * 0.04 });
  });

  B.front = drawFrontLayer(S);

  // pétalo suelto para partículas
  B.petals = PAL.map(p => {
    const sz = 30, s = mk(sz * 1.5, sz * 1.5, S);

  // brillo de luciérnaga

  fg.x.fillStyle = gg; fg.x.fillRect(0, 0, 40, 40);
  B.glow = fg;
  return B;
}

function makeBackground(w, h, dpr, view, oxv, oyv, tokens) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr));
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  let g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, tokens.top); g.addColorStop(1, tokens.bottom);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  // resplandor cálido tras el ramo
  const cx = oxv + 400 * view, cy = oyv + 560 * view, R = 560 * view;
  g = x.createRadialGradient(cx, cy, 0, cx, cy, R);
  g.addColorStop(0, tokens.glow); g.addColorStop(0.55, 'rgba(255,190,50,0.06)'); g.addColorStop(1, 'rgba(255,190,50,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  // bokeh
  const rs = mulberry32(99);
  for (let i = 0; i < 26; i++) {
    const bx = rs() * w, by = rs() * h, br = (10 + rs() * 46) * Math.max(0.6, view);
    const warm = rs() < 0.55;
    const gr = x.createRadialGradient(bx, by, br * 0.6, bx, by, br);
    const a = 0.03 + rs() * 0.07;
    gr.addColorStop(0, warm ? 'rgba(255,205,90,' + a * 0.5 + ')' : 'rgba(120,220,170,' + a * 0.4 + ')');
    gr.addColorStop(0.85, warm ? 'rgba(255,205,90,' + a + ')' : 'rgba(120,220,170,' + a * 0.8 + ')');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = gr; x.beginPath(); x.arc(bx, by, br, 0, TAU); x.fill();
  }
  // viñeta
  g = x.createRadialGradient(w / 2, h * 0.5, Math.min(w, h) * 0.35, w / 2, h * 0.5, Math.max(w, h) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  // grano
  const gc = document.createElement('canvas'); gc.width = 128; gc.height = 128;
  const gx = gc.getContext('2d'); const id = gx.createImageData(128, 128);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.floor(rs() * 255); id.data[i] = v; id.data[i + 1] = v; id.data[i + 2] = v; id.data[i + 3] = 10; }
  gx.putImageData(id, 0, 0);
  x.fillStyle = x.createPattern(gc, 'repeat'); x.fillRect(0, 0, w, h);
  return c;
}

/* =====================================================================
   Aplicación
   ===================================================================== */
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');
const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

let dpr = 1, cssW = 0, cssH = 0, view = 1, ox = 0, oy = 0, S = 1;
let B = null, bg = null, builtS = 0;
let lean = 0, leanT = 0, tilt = 0, pointerLean = 0;
const petals = [], flies = [];
let lastT = 0, idleT = 4;

function tokens() {
  const cs = window.getComputedStyle ? getComputedStyle(document.documentElement) : null;
  const g = (k, d) => { const v = cs && cs.getPropertyValue(k); return (v && v.trim()) || d; };
  return { top: g('--bg-top', '#0b211d'), bottom: g('--bg-bottom', '#04100e'), glow: g('--glow', 'rgba(255,196,60,0.24)') };
}

function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cssW = window.innerWidth; cssH = window.innerHeight;
  canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
  view = Math.min(cssW / 770, cssH / 1090);
  ox = cssW / 2 - 400 * view;
  oy = cssH / 2 - 680 * view;
  S = view * dpr;
  bg = makeBackground(cssW, cssH, dpr, view, ox, oy, tokens());
  if (!B || Math.abs(S / builtS - 1) > 0.15) { B = build(S); builtS = S; }
}

function swayAngle(t, ph, amp) {
  const k = reduce ? 0.25 : 1;
  return lean + k * amp * (0.010 * Math.sin(t * 0.9 + ph) + 0.0055 * Math.sin(t * 1.7 + ph * 2.1) + 0.006 * Math.sin(t * 0.35));
}

function drawItem(c, it, t) {
  const a = swayAngle(t, it.ph, it.amp);
  c.save();
  c.translate(TIE.x, TIE.y); c.rotate(a); c.translate(-TIE.x, -TIE.y);
  c.translate(it.x, it.y);
  c.rotate(it.rot + (reduce ? 0 : Math.sin(t * 1.3 + it.ph) * it.amp * 0.03));
  if (it.s !== 1) c.scale(it.s, it.s);
  c.drawImage(it.spr.c, -it.spr.ax, -it.spr.ay, it.spr.w, it.spr.h);
  c.restore();
}

function drawStem(c, r, t) {
  const a = swayAngle(t, r.ph, r.amp);
  c.save();
  c.translate(TIE.x, TIE.y); c.rotate(a); c.translate(-TIE.x, -TIE.y);
  c.lineCap = 'round';
  const mx = (r.A.x + r.tx) / 2 + (r.A.x < TIE.x ? 10 : -10), my = (r.A.y + TIE.y) / 2;
  const w = r.bud ? 6 : 9;
  c.strokeStyle = '#2b5a1d'; c.lineWidth = w;
  c.beginPath(); c.moveTo(r.A.x, r.A.y); c.quadraticCurveTo(mx, my, r.tx, TIE.y - 4); c.stroke();
  c.strokeStyle = 'rgba(150,205,95,0.5)'; c.lineWidth = w * 0.28;
  c.beginPath(); c.moveTo(r.A.x - w * 0.22, r.A.y); c.quadraticCurveTo(mx - w * 0.22, my, r.tx - w * 0.22, TIE.y - 4); c.stroke();
  c.restore();
}

function drawRose(c, r, t) {
  const a = swayAngle(t, r.ph, r.amp);
  c.save();
  c.translate(TIE.x, TIE.y); c.rotate(a); c.translate(-TIE.x, -TIE.y);
  c.translate(r.A.x, r.A.y); c.rotate(r.kick); c.translate(-r.A.x, -r.A.y);
  c.translate(r.x, r.y); c.rotate(r.rot);
  c.drawImage(r.spr.c, -r.spr.ax, -r.spr.ay, r.spr.w, r.spr.h);
  c.restore();
}

function headPos(r, t) {
  const a = swayAngle(t, r.ph, r.amp);
  const dx = r.x - TIE.x, dy = r.y - TIE.y;
  const cs = Math.cos(a), sn = Math.sin(a);
  return { x: TIE.x + dx * cs - dy * sn, y: TIE.y + dx * sn + dy * cs };
}

function spawnPetals(r, t, n) {
  const p = headPos(r, t);
  for (let i = 0; i < n; i++) {
    const a = rr(-Math.PI, 0);
    petals.push({
      x: p.x + Math.cos(a) * r.r * 0.4, y: p.y + Math.sin(a) * r.r * 0.3,
      vx: Math.cos(a) * rr(30, 110), vy: Math.sin(a) * rr(30, 120) - 10,
      rot: rr(0, TAU), vr: rr(-3, 3), s: rr(0.5, 0.9), ph: rr(0, TAU),
      k: Math.floor(rr(0, 3)), life: 0
    });
  }
}

function initFlies() {
  flies.length = 0;
  for (let i = 0; i < 24; i++) flies.push({ x: rr(20, 780), y: rr(150, 1150), v: rr(6, 18), ph: rr(0, TAU), s: rr(0.35, 0.9) });
}

function frame(t) {
  const dt = Math.min(0.05, Math.max(0, t - lastT)); lastT = t;
  lean += ((pointerLean + tilt) - lean) * Math.min(1, dt * 4);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
  ctx.setTransform(S, 0, 0, S, ox * dpr, oy * dpr);
  ctx.imageSmoothingEnabled = true;
  try { ctx.imageSmoothingQuality = 'high'; } catch (e) {}

  ctx.drawImage(B.back.c, 0, 0, VW, VH);
  B.backItems.forEach(it => drawItem(ctx, it, t));
  B.roses.forEach(r => drawStem(ctx, r, t));
  // resortes de las rosas
  B.roses.forEach(r => {
    r.kickV += (-90 * r.kick - 5 * r.kickV) * dt; r.kick += r.kickV * dt;
    drawRose(ctx, r, t);
  });
  B.frontItems.forEach(it => drawItem(ctx, it, t));
  ctx.drawImage(B.front.c, 0, 0, VW, VH);

  // pétalos
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i];
    p.life += dt;
    p.vy += 340 * dt; p.vx *= (1 - 0.9 * dt); p.vy *= (1 - 0.7 * dt);
    p.vx += Math.sin(t * 3 + p.ph) * 60 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.y > VH + 80) { petals.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(p.s, p.s * (0.55 + 0.45 * Math.abs(Math.cos(t * 3 + p.ph))));
    const sp = B.petals[p.k];
    ctx.drawImage(sp.c, -sp.ax, -sp.ay, sp.w, sp.h);
    ctx.restore();
  }
  // luciérnagas
  ctx.globalCompositeOperation = 'lighter';
  flies.forEach(f => {
    if (!reduce) { f.y -= f.v * dt; f.x += Math.sin(t * 0.5 + f.ph) * 9 * dt; if (f.y < 80) { f.y = 1160; f.x = rr(20, 780); } }
    const al = 0.25 + 0.75 * Math.pow(Math.sin(t * 1.1 + f.ph), 2);
    ctx.globalAlpha = al * 0.9;
    const g = B.glow, sz = 22 * f.s;
    ctx.drawImage(g.c, f.x - sz, f.y - sz, sz * 2, sz * 2);
  });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  if (!reduce) {
    idleT -= dt;
    if (idleT <= 0 && !document.hidden) {
      idleT = rr(5, 9);
      const cand = B.roses.filter(r => !r.bud);
      spawnPetals(pick(cand), t, 1);
    }
  }
}

function loop(ms) {
  frame(ms / 1000);
  requestAnimationFrame(loop);
}

/* ---- Interacción ---- */
let down = null;
function toVirtual(px, py) { return { x: (px - ox) / view, y: (py - oy) / view }; }
function hitRose(px, py, t) {
  const v = toVirtual(px, py);
  for (let i = B.roses.length - 1; i >= 0; i--) {
    const r = B.roses[i];
    const p = headPos(r, t);
    const rad = r.bud ? r.r * 1.0 : r.r * 0.92;
    const cy = r.bud ? p.y - r.r * 1.3 : p.y;
    if (Math.hypot(v.x - p.x, v.y - cy) < rad) return r;
  }
  return null;
}
function onDown(e) {
  down = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
  setLean(e);
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
}
function setLean(e) { pointerLean = clamp((e.clientX - cssW / 2) / (cssW / 2), -1, 1) * 0.045; }
function onMove(e) {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8) down.moved = true;
  if (down || e.pointerType === 'mouse') setLean(e);
  if (e.pointerType === 'mouse' && B) canvas.style.cursor = hitRose(e.clientX, e.clientY, performance.now() / 1000) ? 'pointer' : 'default';
}
function onUp(e) {
  if (down && !down.moved && performance.now() - down.t < 450) {
    const t = performance.now() / 1000;
    const r = hitRose(e.clientX, e.clientY, t);
    if (r) {
      r.kickV += (rnd() < 0.5 ? -1 : 1) * 3.2;
      spawnPetals(r, t, r.bud ? 3 : 9);
      hideHint();
    }
  } else if (down) hideHint();
  down = null;
  if (e.pointerType !== 'mouse') pointerLean = 0;
}
function hideHint() { if (hint) hint.classList.add('off'); }

let g0 = null;
function onOrient(e) {
  if (e.gamma == null) return;
  if (g0 === null) g0 = e.gamma;
  tilt = clamp((e.gamma - g0) / 45, -1, 1) * 0.04;
}

function start() {
  layout();
  initFlies();
  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', () => { down = null; pointerLean = 0; });
  canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') pointerLean = 0; });
  window.addEventListener('deviceorientation', onOrient);
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: light)');
    if (mq.addEventListener) mq.addEventListener('change', () => layout());
  }
  if (hint) setTimeout(hideHint, 12000);
  requestAnimationFrame(loop);
}

window.__bq = { build: build, layout: layout, frame: frame, start: start, get state() { return { B: B, S: S, view: view, ox: ox, oy: oy }; }, setup: function (o) { S = o.S; view = o.view; dpr = o.dpr; ox = o.ox; oy = o.oy; cssW = o.w; cssH = o.h; B = build(S); builtS = S; bg = makeBackground(cssW, cssH, dpr, view, ox, oy, tokens()); canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr); initFlies(); } };

if (!window.__BQ_TEST) {
  const go = () => start();
  if (document.fonts && document.fonts.load) {
    Promise.race([document.fonts.load('italic 500 30px "Cormorant Garamond"'), new Promise(r => setTimeout(r, 1200))]).then(go, go);
  } else go();
}
})();

</script>
